version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: supplier-doc-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=supplier-docs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplier-doc-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/supplier-docs
      - EVOLUS_ENDPOINT=https://api.evolus.ai/v1
      - EVOLUS_API_KEY=${EVOLUS_API_KEY:-}
      - EVOLUS_MODE=${EVOLUS_MODE:-mock}
      - CONFIDENCE_MIN=${CONFIDENCE_MIN:-0.90}
      - AMOUNT_RISK_LIMIT=${AMOUNT_RISK_LIMIT:-5000}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb

volumes:
  mongo_data:
